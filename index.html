<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<script src="runtime.js"></script>
</head>
<body>
<title>MotorOne Proofing Bible</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: fixed left rail + scrolling stage. Dark navy ground, one electric-blue gradient accent, 16px radii throughout. Committed dark theme (the brief asks for dark mode). */
:root{
  color-scheme:dark;
  --bg:#090C13; --bg-rail:#0C1018; --surface:#121826; --surface-2:#182033; --surface-3:#1F2940;
  --line:rgba(148,170,210,.12); --line-strong:rgba(148,170,210,.24);
  --fg:#EDF2FA; --fg-2:#A7B3C8; --fg-3:#6F7C94;
  --accent:#2F7BFF; --accent-2:#00C8FF; --accent-soft:rgba(47,123,255,.16);
  --grad:linear-gradient(135deg,#1F62FF 0%,#00C8FF 100%);
  --grad-soft:linear-gradient(135deg,rgba(31,98,255,.35),rgba(0,200,255,.18));
  --glow:0 0 0 1px rgba(47,123,255,.45),0 14px 44px -14px rgba(0,200,255,.45);
  --ok:#2BD576; --warn:#FFB224; --danger:#FF5C6C;
  --font:'Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --r-sm:10px; --r:16px; --r-lg:22px;
  --rail:252px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
h1,h2,h3,h4{margin:0;text-wrap:balance;line-height:1.15}
h1{font-size:clamp(26px,3.2vw,38px);font-weight:800;letter-spacing:-.02em}
h2{font-size:17px;font-weight:600;color:var(--fg-2)}
h3{font-size:15px;font-weight:600}
p{margin:0}
a{color:var(--accent-2)}
button{font:inherit;color:inherit}
input,select,textarea{font:inherit;color:var(--fg)}
img{max-width:100%;display:block}
:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px;border-radius:6px}
::selection{background:rgba(0,200,255,.35)}

/* ---------- rail ---------- */
.app{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);min-height:100%}
.rail{position:fixed;left:0;top:0;bottom:0;width:var(--rail);background:var(--bg-rail);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:calc(18px + env(safe-area-inset-top,0px)) 14px calc(16px + env(safe-area-inset-bottom,0px));z-index:30}
.brand{display:flex;align-items:center;gap:11px;padding:4px 8px 18px}
.brand .mark{width:36px;height:36px;border-radius:11px;background:var(--grad);display:grid;place-items:center;font-weight:800;font-size:13px;letter-spacing:.02em;color:#fff;box-shadow:0 8px 24px -8px rgba(0,200,255,.6)}
.brand b{display:block;font-size:14px;font-weight:700;letter-spacing:-.01em}
.brand small{display:block;color:var(--fg-3);font-size:11.5px;font-weight:500}
.nav{display:flex;flex-direction:column;gap:3px}
.nav .lbl{font-size:10.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--fg-3);padding:14px 10px 6px}
.nav a{display:flex;align-items:center;gap:11px;padding:10px 11px;border-radius:12px;color:var(--fg-2);text-decoration:none;font-weight:500;font-size:14px;transition:background .15s,color .15s}
.nav a svg{width:18px;height:18px;flex:none;opacity:.85}
.nav a:hover{background:var(--surface);color:var(--fg)}
.nav a.active{background:var(--grad-soft);color:#fff;box-shadow:inset 0 0 0 1px rgba(47,123,255,.35)}
.nav a.active svg{opacity:1}
.nav a .soon{margin-left:auto;font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-3);background:var(--surface-2);padding:2px 7px;border-radius:999px}
.nav a .count{margin-left:auto;font-size:11.5px;font-weight:600;color:var(--fg-3);font-variant-numeric:tabular-nums}
.rail .spacer{flex:1}
.rail .foot{padding:10px 10px 0;color:var(--fg-3);font-size:11.5px;line-height:1.4;border-top:1px solid var(--line)}

/* ---------- topbar (phone) ---------- */
.topbar{display:none;position:sticky;top:env(safe-area-inset-top,0px);z-index:25;background:rgba(9,12,19,.85);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:10px 16px;align-items:center;gap:10px}
.topbar .mark{width:30px;height:30px;border-radius:9px;background:var(--grad);display:grid;place-items:center;font-weight:800;font-size:11px;color:#fff}
.topbar b{font-size:14px}
.topbar .menu{margin-left:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px;width:38px;height:38px;display:grid;place-items:center;cursor:pointer}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:29;display:none}
.scrim.on{display:block}

/* ---------- stage ---------- */
.stage{grid-column:2;min-width:0;padding:28px 32px 64px;max-width:1440px}
.stage-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--accent-2);margin-bottom:6px}
.sub{color:var(--fg-2);margin-top:4px;max-width:62ch}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.search{position:relative;min-width:240px;flex:1}
.search input{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px 10px 38px;font-size:14px;outline:none;transition:border-color .15s,box-shadow .15s}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--fg-3)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:12.5px;font-weight:500;color:var(--fg-2);cursor:pointer;transition:all .15s}
.chip:hover{color:var(--fg);border-color:var(--line-strong)}
.chip.on{background:var(--grad-soft);color:#fff;border-color:rgba(47,123,255,.5)}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:9px 14px;font-size:13px;font-weight:600;cursor:pointer;text-decoration:none;color:var(--fg);transition:all .15s;white-space:nowrap}
.btn svg{width:15px;height:15px}
.btn:hover{border-color:var(--line-strong);background:var(--surface-3)}
.btn.primary{background:var(--grad);border-color:transparent;color:#fff;box-shadow:0 10px 26px -12px rgba(0,200,255,.6)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 10px;font-size:12px;border-radius:10px}
.btn.danger{color:var(--danger);border-color:rgba(255,92,108,.35)}
.btn.danger:hover{background:rgba(255,92,108,.12)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.icon-btn{background:transparent;border:1px solid transparent;border-radius:8px;width:28px;height:28px;display:inline-grid;place-items:center;cursor:pointer;color:var(--fg-3);transition:all .15s;flex:none}
.icon-btn svg{width:14px;height:14px}
.icon-btn:hover{color:var(--fg);background:var(--surface-3);border-color:var(--line)}

/* ---------- client grid ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:18px}
.card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;cursor:pointer;text-align:left;padding:0;transition:transform .18s,box-shadow .18s,border-color .18s;display:flex;flex-direction:column;text-decoration:none;color:inherit}
.card:hover{transform:translateY(-3px);box-shadow:var(--glow);border-color:rgba(47,123,255,.4)}
.card .media{position:relative;aspect-ratio:16/8;background:var(--surface-2)}
.card .media img{width:100%;height:100%;object-fit:cover}
.card .media .ph{position:absolute;inset:0;background:radial-gradient(120% 90% at 10% 0%,rgba(31,98,255,.35),transparent 60%),radial-gradient(90% 80% at 100% 100%,rgba(0,200,255,.22),transparent 60%),var(--surface-2)}
.card .media:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(9,12,19,0) 35%,rgba(9,12,19,.85) 100%)}
.plate{background:#fff;border-radius:12px;display:grid;place-items:center;padding:8px 12px;box-shadow:0 10px 30px -10px rgba(0,0,0,.6)}
.plate img{max-height:100%;max-width:100%;object-fit:contain}
.plate .txt{font-weight:800;color:#0B1324;letter-spacing:-.02em;font-size:15px}
.card .plate{position:absolute;left:16px;bottom:-18px;width:88px;height:56px;z-index:2}
.card .body{padding:30px 16px 16px;display:flex;flex-direction:column;gap:10px;flex:1}
.card .name{font-size:17px;font-weight:700;letter-spacing:-.01em}
.card .meta{color:var(--fg-2);font-size:13px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.card .meta .dot{width:3px;height:3px;border-radius:50%;background:var(--fg-3)}
.card .foot{display:flex;align-items:center;gap:8px;margin-top:auto;padding-top:6px;color:var(--fg-3);font-size:12px;flex-wrap:wrap}
.card .foot .right{margin-left:auto;font-variant-numeric:tabular-nums}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px;font-size:11.5px;font-weight:700;letter-spacing:.02em;line-height:1.2;white-space:nowrap}
.pill.t1{background:var(--grad);color:#fff}
.pill.t2{background:rgba(47,123,255,.22);color:#9CC2FF;border:1px solid rgba(47,123,255,.35)}
.pill.t3{background:var(--surface-3);color:var(--fg-2);border:1px solid var(--line)}
.pill.mono{background:var(--surface-2);color:var(--fg-2);border:1px solid var(--line);font-weight:600;font-variant-numeric:tabular-nums}
.skel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);height:240px;position:relative;overflow:hidden}
.skel:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.04),transparent);animation:sh 1.4s infinite}
@keyframes sh{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.empty{border:1px dashed var(--line-strong);border-radius:var(--r-lg);padding:40px 24px;text-align:center;color:var(--fg-2);display:flex;flex-direction:column;gap:10px;align-items:center}
.empty b{color:var(--fg);font-size:16px}

/* ---------- client detail ---------- */
.back{display:inline-flex;align-items:center;gap:6px;color:var(--fg-2);text-decoration:none;font-weight:500;font-size:13px;margin-bottom:16px;background:none;border:0;padding:0;cursor:pointer}
.back:hover{color:var(--fg)}
.back svg{width:16px;height:16px}
.hero{position:relative;border-radius:var(--r-lg);overflow:hidden;background:var(--surface);border:1px solid var(--line);min-height:300px;display:flex;align-items:flex-end}
.hero .bg{position:absolute;inset:0}
.hero .bg img{width:100%;height:100%;object-fit:cover}
.hero .bg .ph{position:absolute;inset:0;background:radial-gradient(90% 90% at 0% 0%,rgba(31,98,255,.45),transparent 60%),radial-gradient(70% 70% at 100% 100%,rgba(0,200,255,.28),transparent 60%),var(--surface-2)}
.hero .bg:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(9,12,19,.05) 0%,rgba(9,12,19,.55) 55%,rgba(9,12,19,.95) 100%)}
.hero .inner{position:relative;z-index:2;padding:28px;display:flex;gap:22px;align-items:flex-end;width:100%;flex-wrap:wrap}
.hero .plate{width:150px;height:96px;flex:none}
.hero .titles{display:flex;flex-direction:column;gap:8px;min-width:0;flex:1}
.hero .titles .trow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.hero .ph-note{position:absolute;top:14px;right:14px;z-index:2;font-size:12px;color:var(--fg-2);background:rgba(9,12,19,.6);border:1px solid var(--line);padding:6px 10px;border-radius:999px;backdrop-filter:blur(8px)}
.infostrip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:18px}
.info{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:6px;min-width:0}
.info .k{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--fg-3)}
.info .v{display:flex;align-items:flex-start;gap:8px;justify-content:space-between}
.info h3{font-size:16px;font-weight:600;line-height:1.35;word-break:break-word}
.metarow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.meta-chip{display:inline-flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:12.5px;color:var(--fg-2);text-decoration:none;max-width:100%}
.meta-chip svg{width:13px;height:13px;color:var(--fg-3);flex:none}
.meta-chip b{color:var(--fg);font-weight:600}
a.meta-chip:hover{border-color:var(--line-strong);color:var(--fg)}
.section{margin-top:30px}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.section-head h2{color:var(--fg);font-size:18px;font-weight:700;letter-spacing:-.01em}
.section-head .hint{color:var(--fg-3);font-size:12.5px}
.brandgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.panel h3{display:flex;align-items:center;gap:8px;margin-bottom:14px;font-size:14px}
.panel h3 svg{width:15px;height:15px;color:var(--accent-2)}
.panel .none{color:var(--fg-3);font-size:13px;border:1px dashed var(--line-strong);border-radius:var(--r-sm);padding:14px;text-align:center}
.fontrow{display:flex;flex-direction:column;gap:6px;padding:12px 0;border-top:1px solid var(--line)}
.fontrow:first-of-type{border-top:0;padding-top:0}
.fontrow .preview{font-size:30px;font-weight:600;line-height:1;letter-spacing:-.01em;color:var(--fg)}
.fontrow .preview.fallback{color:var(--fg-3)}
.fontrow .n{font-weight:600}
.fontrow .role{color:var(--fg-2);font-size:12.5px}
.fontrow .note{color:var(--fg-3);font-size:12px}
.fontrow .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;align-items:center}
.fontrow .file{font-size:12px;color:var(--fg-3);font-variant-numeric:tabular-nums}
.swatches{display:flex;flex-direction:column;gap:6px}
.swatch{display:flex;align-items:center;gap:12px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:8px 10px;cursor:pointer;text-align:left;width:100%;transition:border-color .15s,background .15s}
.swatch:hover{border-color:var(--line-strong);background:var(--surface-3)}
.swatch .dot{width:34px;height:34px;border-radius:10px;flex:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.swatch .lbl{display:flex;flex-direction:column;min-width:0}
.swatch .n{display:block;font-weight:600;font-size:13px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.swatch .role{display:block;color:var(--fg-3);font-size:11.5px}
.swatch .hex{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:600;font-size:12.5px;color:var(--fg-2);letter-spacing:.02em;display:flex;align-items:center;gap:6px;flex:none}
.swatch .hex svg{width:13px;height:13px;color:var(--fg-3)}
.files{display:flex;flex-direction:column;gap:6px}
.file-chip{display:flex;align-items:center;gap:10px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.file-chip .thumb{width:40px;height:40px;border-radius:9px;background:#fff;display:grid;place-items:center;overflow:hidden;flex:none}
.file-chip .thumb img{max-width:85%;max-height:85%;object-fit:contain}
.file-chip .thumb .ext{font-size:10px;font-weight:800;color:#0B1324;letter-spacing:.04em}
.file-chip .n{font-weight:600;font-size:13px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file-chip .s{color:var(--fg-3);font-size:11.5px}
.file-chip .acts{margin-left:auto;display:flex;gap:4px;flex:none}
.sharepoint{display:flex;align-items:center;gap:16px;background:linear-gradient(135deg,rgba(31,98,255,.18),rgba(0,200,255,.08)),var(--surface);border:1px solid rgba(47,123,255,.3);border-radius:var(--r);padding:16px 18px;flex-wrap:wrap}
.sharepoint .ic{width:44px;height:44px;border-radius:12px;background:var(--grad);display:grid;place-items:center;flex:none}
.sharepoint .ic svg{width:22px;height:22px;color:#fff}
.sharepoint .t{flex:1;min-width:200px}
.sharepoint .t b{display:block;font-size:14px}
.sharepoint .t span{display:block;color:var(--fg-2);font-size:12.5px;word-break:break-all}
.ig{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.ig button{position:relative;aspect-ratio:1;border:0;padding:0;background:var(--surface-2);border-radius:10px;overflow:hidden;cursor:pointer}
.ig img{width:100%;height:100%;object-fit:cover;transition:transform .25s}
.ig button:hover img{transform:scale(1.04)}
.ig .cap{position:absolute;inset:auto 0 0 0;padding:22px 10px 9px;background:linear-gradient(180deg,transparent,rgba(9,12,19,.85));color:#fff;font-size:12px;font-weight:600;text-align:left;opacity:0;transition:opacity .2s;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ig button:hover .cap,.ig button:focus-visible .cap{opacity:1}
.ig .ph{position:absolute;inset:0;background:var(--grad-soft)}
.ig .vid{position:absolute;top:8px;right:8px;width:22px;height:22px;border-radius:50%;background:rgba(9,12,19,.7);display:grid;place-items:center}
.ig .vid svg{width:11px;height:11px;color:#fff}
.rules{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.rules li{display:flex;gap:12px;align-items:flex-start;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;line-height:1.5}
.rules li .ck{width:22px;height:22px;border-radius:7px;background:var(--grad-soft);border:1px solid rgba(47,123,255,.4);display:grid;place-items:center;flex:none;margin-top:1px}
.rules li .ck svg{width:12px;height:12px;color:var(--accent-2)}
.two{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:14px}

/* ---------- lightbox ---------- */
.lb{position:fixed;inset:0;z-index:60;background:rgba(5,8,14,.9);backdrop-filter:blur(10px);display:none;align-items:center;justify-content:center;padding:24px}
.lb.on{display:flex}
.lb .frame{max-width:min(1100px,100%);width:100%;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;max-height:calc(100vh - 48px)}
.lb .pic{background:#05080E;display:grid;place-items:center;min-height:300px;position:relative}
.lb .pic img,.lb .pic video{max-width:100%;max-height:calc(100vh - 48px);object-fit:contain}
.lb .side{padding:22px;display:flex;flex-direction:column;gap:10px;overflow:auto;min-width:0}
.lb .side .k{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--fg-3)}
.lb .side h3{font-size:18px}
.lb .side .notes{color:var(--fg-2);white-space:pre-wrap;font-size:13.5px}
.lb .close{position:absolute;top:12px;right:12px;z-index:3}
.lb .arr{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;background:rgba(9,12,19,.7);border:1px solid var(--line);color:#fff;display:grid;place-items:center;cursor:pointer}
.lb .arr svg{width:16px;height:16px}
.lb .arr.l{left:12px}.lb .arr.r{right:12px}
.lb .acts{margin-top:auto;display:flex;gap:8px;flex-wrap:wrap}

/* ---------- settings ---------- */
.settings{display:grid;grid-template-columns:260px minmax(0,1fr);gap:18px;align-items:start}
.slist{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px;position:sticky;top:20px;display:flex;flex-direction:column;gap:4px;max-height:calc(100vh - 40px);overflow:auto}
.slist .add{margin-bottom:6px;justify-content:center}
.slist button.item{display:flex;align-items:center;gap:10px;width:100%;background:transparent;border:1px solid transparent;border-radius:11px;padding:9px 10px;cursor:pointer;text-align:left}
.slist button.item:hover{background:var(--surface-2)}
.slist button.item.on{background:var(--grad-soft);border-color:rgba(47,123,255,.4)}
.slist .mini{width:34px;height:24px;border-radius:7px;background:#fff;display:grid;place-items:center;flex:none;overflow:hidden}

  const map = {not_granted:'This view can’t write to the store.', invalid_argument:'The store refused that write. Check the fields and try again.', quota_exceeded:'Storage is full. Remove old items to make room.', quota_or_state:'Asset storage is full or unavailable.', too_large:'That file is over the size limit (20 MB, 2 MB for SVG).', unsupported_type:'That file type isn’t supported.', rate_limited:'Too many requests. Wait a moment and retry.', unavailable:'The store is briefly unavailable. Try again.', store_unavailable:'Asset storage is briefly unavailable. Try again.', revoked:'Access to this page changed. Reload to continue.'};
  return map[c] || (e && e.message) || 'Something went wrong.';
}

/* ---------- fonts from uploaded files ---------- */
const fontCache = new Map();
function ensureFont(file){
  if (!file || !file.asset) return null;
  const fam = 'cf_' + file.asset;
  if (!fontCache.has(fam)) {
    try { const ff = new FontFace(fam, 'url(' + srcOf(file) + ')'); fontCache.set(fam, ff.load().then(f => { document.fonts.add(f); return fam; }).catch(() => null)); }
    catch (e) { fontCache.set(fam, Promise.resolve(null)); }
  }
  return fam;
}

/* ---------- routing ---------- */
const VIEWS = ['clients', 'content', 'guidelines', 'settings'];
function readHash(){
  const h = (location.hash || '').slice(1);
  if (h.indexOf('client-') === 0) { state.view = 'client'; state.selected = h.slice(7); }
  else if (VIEWS.indexOf(h) >= 0) { state.view = h; }
}
function navigate(view, sel){
  state.view = view; state.selected = sel || null; state.lightbox = null; closeLightbox();
  const h = view === 'client' && sel ? 'client-' + sel : view;
  try { if (location.hash !== '#' + h) history.replaceState(null, '', '#' + h); } catch (e) {}
  render(); window.scrollTo(0, 0); closeRail();
}
window.addEventListener('hashchange', () => { readHash(); render(); });

/* ---------- rail (phone) ---------- */
function closeRail(){ $('#rail').classList.remove('open'); $('#scrim').classList.remove('on'); }
$('#menuBtn').addEventListener('click', () => { $('#rail').classList.toggle('open'); $('#scrim').classList.toggle('on'); });
$('#scrim').addEventListener('click', closeRail);
$$('.nav a').forEach(a => a.addEventListener('click', e => { e.preventDefault(); navigate(a.dataset.view); }));

/* ---------- render root ---------- */
function render(opts){
  const soft = opts && opts.soft;
  $$('.nav a').forEach(a => a.classList.toggle('active', a.dataset.view === (state.view === 'client' ? 'clients' : state.view)));
  $('#navCount').textContent = state.clients.length ? state.clients.length : '';
  const stage = $('#stage');
  if (state.view === 'settings') {
    if (soft && $('#settings-root')) { renderSettingsList(); return; }
    stage.innerHTML = viewSettings(); afterSettings(); return;
  }
  if (state.view === 'clients') {
    if (soft && $('#grid')) { $('#grid').innerHTML = gridHtml(); const bc = $('#brandChips'); if (bc) bc.innerHTML = brandChipsHtml(); return; }
    stage.innerHTML = viewClients(); afterClients(); return;
  }
  if (state.view === 'client') { stage.innerHTML = viewClient(); return; }
  stage.innerHTML = viewSoon(state.view);
}
/* one delegated click handler for the stage, so re-renders never stack listeners */
$('#stage').addEventListener('click', e => {
  const go = e.target.closest('[data-go]'); if (go) { e.preventDefault(); navigate(go.dataset.go); return; }
  const open = e.target.closest('[data-open]'); if (open) { e.preventDefault(); navigate('client', open.dataset.open); return; }
  if (e.target.closest('[data-back]')) { navigate('clients'); return; }
  const cp = e.target.closest('[data-copy]'); if (cp) { copyText(cp.dataset.copy, cp.dataset.label || cp.dataset.copy, cp.dataset.sw); return; }
  const dl = e.target.closest('[data-dl]'); if (dl) { downloadAsset(dl.dataset.dl, dl.dataset.name); return; }
  const lb = e.target.closest('[data-lb]'); if (lb) { openLightbox(state.selected, +lb.dataset.lb); return; }
});

async function downloadAsset(src, name){
  if (!caps.downloads) { toast('Downloads aren’t available in this view'); return; }
  try {
    toast('Preparing ' + name + '…');
    const r = await fetch(src); if (!r.ok) throw new Error('missing');
    const blob = await r.blob();
    await caps.downloads.save({filename: name || 'file', data: blob});
    toast('Saved ' + name);
  } catch (e) { if (e && e.code === 'cancelled') return; toast(e && e.code ? errMsg(e) : 'Couldn’t download ' + name); }
}

/* ---------- lightbox ---------- */
function openLightbox(clientId, idx){ state.lightbox = {clientId: clientId, idx: idx}; renderLightbox(); }
function closeLightbox(){ state.lightbox = null; const lb = $('#lb'); lb.classList.remove('on'); lb.innerHTML = ''; }
function renderLightbox(){
  const lb = $('#lb'); const L = state.lightbox; if (!L) return closeLightbox();
  const c = clientById(L.clientId); const camps = c ? (c.campaigns || []) : []; const k = camps[L.idx]; if (!k) return closeLightbox();
  const src = srcOf(k.media);
  lb.innerHTML = '<div class="frame"><div class="pic">' + (src ? (isVideo(k.media) ? '<video src="' + attr(src) + '" controls playsinline></video>' : '<img src="' + attr(src) + '" alt="' + attr(k.title || '') + '">') : '') +
    (camps.length > 1 ? '<button class="arr l" data-nav="-1" aria-label="Previous">' + I.arrowL + '</button><button class="arr r" data-nav="1" aria-label="Next">' + I.arrowR + '</button>' : '') + '</div>' +
    '<div class="side"><button class="icon-btn close" data-close aria-label="Close">' + I.close + '</button><div class="k">' + esc(c.name) + ' · ' + (L.idx + 1) + ' of ' + camps.length + '</div><h3>' + esc(k.title || 'Untitled campaign') + '</h3>' + (k.date ? '<div style="color:var(--fg-2);font-size:13px">' + esc(fmtDate(k.date)) + '</div>' : '') + (k.notes ? '<div class="notes">' + esc(k.notes) + '</div>' : '') +
    '<div class="acts">' + (k.link ? '<a class="btn primary" href="' + attr(k.link) + '" target="_blank" rel="noopener">' + I.ext + 'Open link</a>' : '') + (k.media ? '<button class="btn" data-dl="' + attr(srcOf(k.media)) + '" data-name="' + attr(k.media.name) + '">' + I.down + 'Download</button>' : '') + '</div></div></div>';
  lb.classList.add('on');
  lb.onclick = e => {
    if (e.target === lb || e.target.closest('[data-close]')) { closeLightbox(); return; }
    const n = e.target.closest('[data-nav]'); if (n) { state.lightbox.idx = (state.lightbox.idx + (+n.dataset.nav) + camps.length) % camps.length; renderLightbox(); return; }
    const dl = e.target.closest('[data-dl]'); if (dl) downloadAsset(dl.dataset.dl, dl.dataset.name);
  };
}
document.addEventListener('keydown', e => {
  if (state.lightbox) { if (e.key === 'Escape') closeLightbox(); if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') { const c = clientById(state.lightbox.clientId); const n = c ? (c.campaigns || []).length : 0; if (n > 1) { state.lightbox.idx = (state.lightbox.idx + (e.key === 'ArrowRight' ? 1 : -1) + n) % n; renderLightbox(); } } }
  else if (e.key === 'Escape') closeRail();
});

function field(label, path, val, opts){
  opts = opts || {};
  const id = 'f_' + path.replace(/[^a-z0-9]/gi, '_');
  let input;
  if (opts.type === 'select') input = '<select id="' + id + '" data-f="' + path + '">' + opts.options.map(o => '<option value="' + attr(o[0]) + '"' + (String(o[0]) === String(val) ? ' selected' : '') + '>' + esc(o[1]) + '</option>').join('') + '</select>';
  else if (opts.type === 'textarea') input = '<textarea id="' + id + '" data-f="' + path + '" placeholder="' + attr(opts.placeholder || '') + '">' + esc(val) + '</textarea>';
  else input = '<input id="' + id + '" type="' + (opts.type || 'text') + '" data-f="' + path + '" value="' + attr(val == null ? '' : val) + '" placeholder="' + attr(opts.placeholder || '') + '">';
  return '<div class="field' + (opts.wide ? ' wide' : '') + '"><label for="' + id + '">' + esc(label) + '</label>' + input + (opts.help ? '<div class="help">' + esc(opts.help) + '</div>' : '') + '</div>';
}
function formHtml(){
  const d = state.draft;
  if (!d) return '<div class="empty"><b>No client selected</b><p>Pick a client on the left, or add a new one.</p></div>';
  const ro = state.canWrite === false || !caps.db;
  const up = !!caps.assets && !ro;
  const upNote = up ? '' : '<div class="help">Uploads are only available to editors of this page.</div>';
  const thumb = f => { const ext = f ? extOf(f.name) : ''; return /^(png|jpg|jpeg|gif|webp|svg)$/.test(ext) ? '<img src="' + attr(srcOf(f)) + '" alt="">' : '<span class="ext">' + esc(ext.toUpperCase() || 'FILE') + '</span>'; };
  return '<div class="fs"><h3>' + I.id + 'Identity</h3><div class="desc">What shows on the client card and at the top of the client page.</div>' +
      '<div class="frow three">' + field('Client name', 'name', d.name) + field('Tier', 'tier', d.tier, {type:'select', options:[[1,'Tier 1'],[2,'Tier 2'],[3,'Tier 3']]}) + field('Display order', 'order', d.order, {type:'number'}) + '</div>' +
      '<div class="frow">' + field('Brand (manufacturer)', 'brand', d.brand, {placeholder:'e.g. Mazda'}) + field('Location', 'location', d.location, {placeholder:'Suburb, State'}) + '</div>' +
      '<div class="frow" style="margin-top:14px"><div class="field"><label>Client logo</label><div class="uploader"><div class="prev white">' + (d.logo ? '<img src="' + attr(srcOf(d.logo)) + '" alt="">' : '<span class="no">No logo</span>') + '</div><div class="acts">' + (up ? '<label class="btn sm"><input type="file" data-up="logo" accept=".png,.jpg,.jpeg,.svg,.webp">' + I.upload + (d.logo ? 'Replace logo' : 'Upload logo') + '</label>' : '') + (d.logo && !ro ? '<button class="btn sm ghost danger" data-clear="logo">' + I.trash + 'Remove</button>' : '') + '<span class="fn">' + esc(d.logo ? d.logo.name : 'PNG, SVG, JPG or WebP') + '</span></div></div>' + upNote + '</div>' +
      '<div class="field"><label>Dealership image</label><div class="uploader"><div class="prev">' + (d.photo ? '<img src="' + attr(srcOf(d.photo)) + '" alt="">' : '<span class="no">No image</span>') + '</div><div class="acts">' + (up ? '<label class="btn sm"><input type="file" data-up="photo" accept=".png,.jpg,.jpeg,.webp">' + I.upload + (d.photo ? 'Replace image' : 'Upload image') + '</label>' : '') + (d.photo && !ro ? '<button class="btn sm ghost danger" data-clear="photo">' + I.trash + 'Remove</button>' : '') + '<span class="fn">' + esc(d.photo ? d.photo.name : 'Exterior photo, landscape') + '</span></div></div></div></div></div>' +

    '<div class="fs"><h3>' + I.pin + 'Contact details</h3><div class="desc">Shown as the address, phone and dealer number headings on the client page, with copy buttons.</div>' +
      '<div class="frow">' + field('Address', 'address', d.address, {wide:true}) + '</div>' +
      '<div class="frow three">' + field('Phone number', 'phone', d.phone) + field('Dealer number (LMCT)', 'dealerNumber', d.dealerNumber, {placeholder:'LMCT 0000'}) + field('Opening hours', 'hours', d.hours, {placeholder:'Short summary'}) + '</div>' +
      '<div class="frow">' + field('Website', 'website', d.website, {type:'url', placeholder:'https://'}) + field('Dealer group', 'dealerGroup', d.dealerGroup) + '</div>' +
      '<div class="frow">' + field('Instagram URL', 'instagram', d.instagram, {type:'url', placeholder:'https://www.instagram.com/…'}) + field('Facebook URL', 'facebook', d.facebook, {type:'url', placeholder:'https://www.facebook.com/…'}) + '</div></div>' +

    '<div class="fs"><h3>' + I.font + 'Fonts</h3><div class="desc">Name the typeface and its role, then attach the current font file (WOFF2, WOFF, TTF or OTF). The client page previews it and offers the download.</div>' +
      '<div class="rows" id="fontRows">' + (d.fonts || []).map((f, i) => '<div class="row font"><input data-f="fonts.' + i + '.name" value="' + attr(f.name) + '" placeholder="Font name" aria-label="Font name"><input data-f="fonts.' + i + '.role" value="' + attr(f.role) + '" placeholder="Role, e.g. Headlines" aria-label="Font role"><input data-f="fonts.' + i + '.note" value="' + attr(f.note) + '" placeholder="Note, e.g. fallback or licence" aria-label="Font note"><div class="acts">' + (up ? '<label class="icon-btn" title="' + (f.file ? 'Replace file' : 'Upload file') + '"><input type="file" data-upfont="' + i + '" accept=".woff2,.woff,.ttf,.otf">' + I.upload + '</label>' : '') + (ro ? '' : '<button class="icon-btn" title="Remove font" data-rmfont="' + i + '">' + I.trash + '</button>') + '</div>' + (f.file ? '<div class="fn" style="grid-column:1/-1">' + esc(f.file.name) + ' · ' + fmtBytes(f.file.size) + '</div>' : '<div class="fn" style="grid-column:1/-1">No file attached</div>') + '</div>').join('') + '</div>' +
      (ro ? '' : '<button class="btn sm" style="margin-top:10px" data-addfont>' + I.plus + 'Add font</button>') + '</div>' +

    '<div class="fs"><h3>' + I.palette + 'Colours</h3><div class="desc">Hex codes appear as copy-to-clipboard swatches on the client page.</div>' +
      '<div class="rows" id="colourRows">' + (d.colours || []).map((x, i) => '<div class="row colour"><input type="color" data-f="colours.' + i + '.hex" value="' + attr(/^#[0-9a-f]{6}$/i.test(x.hex) ? x.hex : '#000000') + '" aria-label="Pick colour"><input data-f="colours.' + i + '.name" value="' + attr(x.name) + '" placeholder="Colour name" aria-label="Colour name"><input data-f="colours.' + i + '.hex" value="' + attr(x.hex) + '" placeholder="#000000" aria-label="Hex code" style="font-variant-numeric:tabular-nums"><input data-f="colours.' + i + '.role" value="' + attr(x.role) + '" placeholder="Role, e.g. Primary" aria-label="Colour role"><div class="acts">' + (ro ? '' : '<button class="icon-btn" title="Remove colour" data-rmcolour="' + i + '">' + I.trash + '</button>') + '</div></div>').join('') + '</div>' +
      (ro ? '' : '<button class="btn sm" style="margin-top:10px" data-addcolour>' + I.plus + 'Add colour</button>') + '</div>' +

    '<div class="fs"><h3>' + I.layers + 'Branding elements</h3><div class="desc">Brand marks and lockups as files. Uploads are named from the file, e.g. WM_brandmark_png — rename as needed.</div>' +
      '<div class="rows" id="elemRows">' + (d.elements || []).map((el, i) => '<div class="row elem"><div class="thumb">' + thumb(el.file) + '</div><input data-f="elements.' + i + '.name" value="' + attr(el.name) + '" placeholder="Element name" aria-label="Element name"><div class="fn">' + esc(el.file ? el.file.name + ' · ' + fmtBytes(el.file.size) : 'No file') + '</div><div class="acts">' + (up ? '<label class="icon-btn" title="Replace file"><input type="file" data-upelem="' + i + '" accept=".png,.jpg,.jpeg,.svg,.webp,.pdf,.gif">' + I.upload + '</label>' : '') + (ro ? '' : '<button class="icon-btn" title="Remove" data-rmelem="' + i + '">' + I.trash + '</button>') + '</div></div>').join('') + '</div>' +
      (up ? '<label class="btn sm" style="margin-top:10px"><input type="file" data-upelems multiple accept=".png,.jpg,.jpeg,.svg,.webp,.pdf,.gif">' + I.upload + 'Upload brand files</label>' : '') + upNote + '</div>' +

    '<div class="fs"><h3>' + I.folder + 'SharePoint folder</h3><div class="desc">The client’s working folder. Opens in a new tab from the client page.</div><div class="frow">' + field('SharePoint URL', 'sharepoint', d.sharepoint, {type:'url', placeholder:'https://….sharepoint.com/…', wide:true}) + '</div></div>' +

    '<div class="fs"><h3>' + I.image + 'Past campaigns</h3><div class="desc">Square tiles in a feed, newest first. Upload images or MP4 video, then add a title, date, link and notes.</div>' +
      '<div class="camps" id="campRows">' + (d.campaigns || []).map((k, i) => '<div class="camp"><div class="img">' + (k.media ? (isVideo(k.media) ? '<video src="' + attr(srcOf(k.media)) + '" muted playsinline preload="metadata"></video>' : '<img src="' + attr(srcOf(k.media)) + '" alt="">') : '') + '</div><div class="f"><input data-f="campaigns.' + i + '.title" value="' + attr(k.title) + '" placeholder="Campaign title" aria-label="Campaign title"><input type="date" data-f="campaigns.' + i + '.date" value="' + attr(k.date || '') + '" aria-label="Campaign date"><input type="url" data-f="campaigns.' + i + '.link" value="' + attr(k.link) + '" placeholder="Link (optional)" aria-label="Campaign link"><input data-f="campaigns.' + i + '.notes" value="' + attr(k.notes) + '" placeholder="Notes (optional)" aria-label="Campaign notes"></div><div class="acts">' + (ro ? '' : '<button class="icon-btn" title="Move earlier" data-mvcamp="' + i + '" data-dir="-1">' + I.left + '</button><button class="icon-btn" title="Move later" data-mvcamp="' + i + '" data-dir="1">' + I.right + '</button>' + (up ? '<label class="icon-btn" title="Replace media"><input type="file" data-upcamp="' + i + '" accept=".png,.jpg,.jpeg,.webp,.gif,.mp4,.webm">' + I.upload + '</label>' : '') + '<button class="icon-btn" title="Remove" data-rmcamp="' + i + '">' + I.trash + '</button>') + '</div></div>').join('') + '</div>' +
      (up ? '<label class="btn sm" style="margin-top:10px"><input type="file" data-upcamps multiple accept=".png,.jpg,.jpeg,.webp,.gif,.mp4,.webm">' + I.upload + 'Upload campaign tiles</label>' : '') + upNote + '</div>' +

    '<div class="fs"><h3>' + I.rules + 'Rules</h3><div class="desc">One proofing rule per line. These render as a checklist on the client page.</div><div class="frow">' + field('Proofing rules', 'rulesText', (d.rules || []).join('\n'), {type:'textarea', wide:true, placeholder:'Dealer licence number must appear on every asset\nPhone number must match the website'}) + '</div></div>' +

    (ro ? '' : '<div class="fs danger-zone"><h3>' + I.trash + 'Remove client</h3><div class="desc">Deletes this client’s record from the library. Uploaded files stay in storage until removed.</div>' + (state.confirmDelete ? '<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn danger" data-del-confirm>' + I.trash + 'Yes, delete ' + esc(d.name) + '</button><button class="btn" data-del-cancel>Keep it</button></div>' : '<button class="btn danger" data-del>' + I.trash + 'Delete client</button>') + '</div>') +

    '<div class="savebar"><div class="st ' + (state.status === 'Saved' ? 'ok' : state.status === 'Saving…' ? 'busy' : state.status === 'Not saved' ? 'err' : '') + '" id="saveStatus"><span class="d"></span><span>' + esc(state.status || (ro ? 'Read-only' : 'No changes')) + '</span></div><div class="right"><button class="btn" data-view-client="' + attr(d.id) + '">' + I.ext + 'View client page</button>' + (ro ? '' : '<button class="btn primary" data-save-now>' + I.check + 'Save now</button>') + '</div></div>';
}
function setStatus(s){ state.status = s; const el = $('#saveStatus'); if (!el) return; el.className = 'st ' + (s === 'Saved' ? 'ok' : s === 'Saving…' ? 'busy' : s === 'Not saved' ? 'err' : ''); el.lastElementChild.textContent = s; }
function setPath(obj, path, val){ const ks = path.split('.'); let o = obj; for (let i = 0; i < ks.length - 1; i++) { if (o[ks[i]] == null) o[ks[i]] = {}; o = o[ks[i]]; } o[ks[ks.length - 1]] = val; }
let saveTimer = null, chain = Promise.resolve(), inFlight = 0;
function scheduleSave(immediate){ if (!state.draft || !caps.db) return; state.dirty = true; setStatus('Unsaved'); if (saveTimer) clearTimeout(saveTimer); saveTimer = setTimeout(() => { saveTimer = null; doSave(); }, immediate ? 0 : 900); }
function flushSave(){ if (saveTimer) { clearTimeout(saveTimer); saveTimer = null; } if (state.dirty) doSave(); }
function doSave(){
  if (!caps.db || !state.draft) return;
  const id = state.draft.id; const stamp = new Date().toISOString(); state.draft.updatedAt = stamp;
  const body = JSON.parse(JSON.stringify(state.draft)); delete body.id; body.tier = +body.tier || 1; body.order = +body.order || 0;
  inFlight++; setStatus('Saving…');
  chain = chain.then(() => caps.db.doc('clients/' + id).set(body)).then(() => { inFlight--; if (!saveTimer && !inFlight) { state.dirty = false; setStatus('Saved'); } })
    .catch(e => { inFlight--; setStatus('Not saved'); toast(errMsg(e)); if (e && e.code === 'invalid_argument' && state.canWrite == null) { state.canWrite = false; } });
}
function rerenderForm(){ const f = $('#s-form'); if (!f) return; const y = window.scrollY; f.innerHTML = formHtml(); window.scrollTo(0, y); }
async function uploadFile(file){
  if (!caps.assets) { toast('Uploads aren’t available in this view'); return null; }
  const ext = extOf(file.name); const type = TYPES[ext];
  if (!type) { toast('Unsupported file type .' + ext); return null; }
  try { toast('Uploading ' + file.name + '…'); const r = await caps.assets.upload(file, {type: type}); const ref = {asset: r.id, name: file.name, type: r.contentType || type, size: r.sizeBytes}; if (/^https?:\/\//.test(r.url || '')) ref.url = r.url; return ref; }
  catch (e) { toast(errMsg(e)); return null; }
}
function afterSettings(){
  const root = $('#settings-root');
  root.addEventListener('click', async e => {
    const sel = e.target.closest('[data-sel]'); if (sel) { flushSave(); loadDraft(sel.dataset.sel); renderSettingsList(); rerenderForm(); return; }
    if (e.target.closest('[data-add]')) { flushSave(); const c = blankClient(); state.clients.push(JSON.parse(JSON.stringify(c))); state.draft = c; state.sel = c.id; state.dirty = true; state.confirmDelete = false; doSave(); renderSettingsList(); rerenderForm(); if ($('#f_name')) $('#f_name').select(); return; }
    const vc = e.target.closest('[data-view-client]'); if (vc) { flushSave(); navigate('client', vc.dataset.viewClient); return; }
    if (e.target.closest('[data-save-now]')) { if (saveTimer) { clearTimeout(saveTimer); saveTimer = null; } doSave(); return; }
    if (e.target.closest('[data-addfont]')) { (state.draft.fonts = state.draft.fonts || []).push({name:'', role:'', note:'', file:null}); rerenderForm(); return; }
    if (e.target.closest('[data-addcolour]')) { (state.draft.colours = state.draft.colours || []).push({name:'', hex:'#000000', role:''}); rerenderForm(); return; }
    const rf = e.target.closest('[data-rmfont]'); if (rf) { state.draft.fonts.splice(+rf.dataset.rmfont, 1); rerenderForm(); scheduleSave(true); return; }
    const rc = e.target.closest('[data-rmcolour]'); if (rc) { state.draft.colours.splice(+rc.dataset.rmcolour, 1); rerenderForm(); scheduleSave(true); return; }
    const re = e.target.closest('[data-rmelem]'); if (re) { state.draft.elements.splice(+re.dataset.rmelem, 1); rerenderForm(); scheduleSave(true); return; }
    const rk = e.target.closest('[data-rmcamp]'); if (rk) { state.draft.campaigns.splice(+rk.dataset.rmcamp, 1); rerenderForm(); scheduleSave(true); return; }
    const mv = e.target.closest('[data-mvcamp]'); if (mv) { const a = state.draft.campaigns; const i = +mv.dataset.mvcamp, j = i + (+mv.dataset.dir); if (j < 0 || j >= a.length) return; const t = a[i]; a[i] = a[j]; a[j] = t; rerenderForm(); scheduleSave(true); return; }
    const cl = e.target.closest('[data-clear]'); if (cl) { state.draft[cl.dataset.clear] = null; rerenderForm(); scheduleSave(true); return; }
    if (e.target.closest('[data-del]')) { state.confirmDelete = true; rerenderForm(); return; }
    if (e.target.closest('[data-del-cancel]')) { state.confirmDelete = false; rerenderForm(); return; }
    if (e.target.closest('[data-del-confirm]')) {
      const id = state.draft.id; if (saveTimer) { clearTimeout(saveTimer); saveTimer = null; } state.dirty = false;
      try { await chain; await caps.db.doc('clients/' + id).delete(); toast('Deleted'); state.clients = state.clients.filter(c => c.id !== id); state.sel = null; state.draft = null; if (state.clients.length) loadDraft(state.clients[0].id); renderSettingsList(); rerenderForm(); }
      catch (err) { toast(errMsg(err)); }
      return;
    }
  });
  root.addEventListener('input', e => {
    const el = e.target; const f = el.dataset.f; if (!f || !state.draft) return;
    let v = el.value;
    if (f === 'rulesText') { state.draft.rules = v.split('\n').map(s => s.trim()).filter(Boolean); scheduleSave(); return; }
    if (f === 'tier' || f === 'order') v = +v;
    if (/^colours\.\d+\.hex$/.test(f)) {
      if (el.type === 'color') { const txt = $('input[type=text][data-f="' + f + '"], input:not([type])[data-f="' + f + '"]', root); if (txt) txt.value = v.toUpperCase(); v = v.toUpperCase(); }
      else { v = v.trim(); if (!v.startsWith('#') && v) v = '#' + v; const pick = $('input[type=color][data-f="' + f + '"]', root); if (pick && /^#[0-9a-f]{6}$/i.test(v)) pick.value = v; }
    }
    setPath(state.draft, f, v); scheduleSave();
    if (f === 'name') { const it = $('#s-list .item.on .n'); if (it) it.textContent = v; }
  });
  root.addEventListener('change', async e => {
    const el = e.target; if (el.type !== 'file' || !el.files || !el.files.length) return;
    const files = Array.from(el.files); el.value = '';
    const d = state.draft; if (!d) return;
    if (el.dataset.up) { const r = await uploadFile(files[0]); if (r) { d[el.dataset.up] = r; rerenderForm(); scheduleSave(true); toast('Uploaded ' + r.name); } return; }
    if (el.dataset.upfont != null) { const r = await uploadFile(files[0]); if (r) { d.fonts[+el.dataset.upfont].file = r; rerenderForm(); scheduleSave(true); toast('Uploaded ' + r.name); } return; }
    if (el.dataset.upelem != null) { const r = await uploadFile(files[0]); if (r) { d.elements[+el.dataset.upelem].file = r; rerenderForm(); scheduleSave(true); toast('Uploaded ' + r.name); } return; }
    if (el.dataset.upcamp != null) { const r = await uploadFile(files[0]); if (r) { d.campaigns[+el.dataset.upcamp].media = r; rerenderForm(); scheduleSave(true); toast('Uploaded ' + r.name); } return; }
    if ('upelems' in el.dataset) {
      d.elements = d.elements || [];
      for (const f of files) { const r = await uploadFile(f); if (r) { const base = f.name.replace(/\.[^.]+$/, '').replace(/[\s-]+/g, '_'); d.elements.push({name: base + '_' + extOf(f.name), file: r}); } }
      rerenderForm(); scheduleSave(true); return;
    }
    if ('upcamps' in el.dataset) {
      d.campaigns = d.campaigns || [];
      const added = [];
      for (const f of files) { const r = await uploadFile(f); if (r) added.push({id: 'k' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), title: f.name.replace(/\.[^.]+$/, '').replace(/[_-]+/g, ' '), date: new Date().toISOString().slice(0, 10), link: '', notes: '', media: r}); }
      d.campaigns = added.concat(d.campaigns);
      rerenderForm(); scheduleSave(true); return;
    }
  });
}
window.addEventListener('beforeunload', () => { if (state.view === 'settings') flushSave(); });

/* ---------- boot ---------- */
readHash(); render();
(async () => {
  const [db, user, assets, downloads] = await Promise.all([use('db'), use('user'), use('assets'), use('downloads')]);
  caps.db = db; caps.user = user; caps.assets = assets; caps.downloads = downloads;
  if (user) { try { state.canWrite = await user.can('data.write'); } catch (e) { state.canWrite = null; } }
  if (!db) { state.storeDown = true; render(); return; }
  db.collection('clients').onSnapshot(snap => {
    const fresh = snap.docs.filter(d => d.exists).map(d => Object.assign({id: d.id}, d.data()));
    fresh.sort((a, b) => (+a.order || 0) - (+b.order || 0) || String(a.name || '').localeCompare(String(b.name || '')));
    state.clients = fresh; state.loaded = true;
    if (state.view === 'settings' && state.draft && !state.dirty && !inFlight) { const c = clientById(state.draft.id); if (c && c.updatedAt !== state.draft.updatedAt) { state.draft = JSON.parse(JSON.stringify(c)); rerenderForm(); } }
    render({soft: true});
  }, err => { state.storeDown = true; state.loaded = true; render(); toast(errMsg(err)); });
})();
})();
</script>
